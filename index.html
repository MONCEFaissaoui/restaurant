<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>La Citadelle | القلعة - خدمة الطاولة</title>
  <meta name="description" content="اطلب الخدمة من طاولتك بضغطة واحدة - خدمة رقمية فاخرة" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  
  <!-- Motion Library for fluid, spring-based script animations -->
  <script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>

  <style>
    :root {
      --bg-dark: #0b0a09;
      --bg-surface: #151311;
      --bg-card: rgba(26, 24, 21, 0.7);
      --gold: #cfa853;
      --gold-hover: #ecd59b;
      --gold-glow: rgba(207, 168, 83, 0.2);
      --cream: #ebdcb9;
      --cream-dim: rgba(235, 220, 185, 0.6);
      --white: #ffffff;
      --text-main: #f6eedb;
      --text-muted: #a69c8c;
      --red: #ff5252;
      --green: #10b981;
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 26px;
      
      --font-serif: 'Playfair Display', 'Cairo', serif;
      --font-sans: 'Outfit', 'Cairo', sans-serif;
      --spring-transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      --smooth-transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: var(--font-sans);
    }

    html, body {
      height: 100%;
      background: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Custom Scrollbar for Menu List */
    .menu-list::-webkit-scrollbar {
      width: 4px;
    }
    .menu-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    .menu-list::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 4px;
    }

    /* ── Landing View ── */
    #landingView {
      position: absolute;
      inset: 0;
      background: url('./bg.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 24px;
      z-index: 10;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
    }

    #landingView::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, 
        rgba(11, 10, 9, 0.98) 0%, 
        rgba(11, 10, 9, 0.7) 40%, 
        rgba(11, 10, 9, 0.3) 100%);
      z-index: -1;
    }

    .landing-header {
      position: absolute;
      top: 8%;
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px;
    }

    .logo-container {
      position: relative;
      margin-bottom: 20px;
      opacity: 0;
      transform: scale(0.8);
      animation: logoEntrance 1s forwards cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .logo-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      box-shadow: 0 0 35px var(--gold-glow);
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .logo-container::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px dashed rgba(207, 168, 83, 0.5);
      animation: spinDashed 20s linear infinite;
    }

    .restaurant-title {
      font-family: var(--font-serif);
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--white);
      text-shadow: 0 4px 15px rgba(0,0,0,0.6);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      opacity: 0;
      transform: translateY(-10px);
      animation: fadeInDown 0.8s forwards 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .table-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(21, 19, 17, 0.65);
      border: 1px solid rgba(207, 168, 83, 0.4);
      padding: 8px 24px;
      border-radius: 50px;
      color: var(--gold);
      font-weight: 700;
      font-size: 1.15rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 10px rgba(207, 168, 83, 0.1);
      opacity: 0;
      transform: translateY(-10px);
      animation: fadeInDown 0.8s forwards 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .table-badge span {
      color: var(--white);
      background: var(--gold);
      padding: 2px 10px;
      border-radius: 12px;
      font-family: var(--font-sans);
    }

    .actions-grid {
      width: 100%;
      max-width: 420px;
      display: grid;
      gap: 16px;
      margin-bottom: 6dvh;
      z-index: 2;
    }

    .btn-action {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(207, 168, 83, 0.15);
      padding: 18px 24px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: var(--spring-transition);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(30px);
    }

    .btn-action:nth-child(1) { animation: fadeInUp 0.8s forwards 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .btn-action:nth-child(2) { animation: fadeInUp 0.8s forwards 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    .btn-action:nth-child(3) { animation: fadeInUp 0.8s forwards 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    
    .btn-action.primary {
      background: linear-gradient(135deg, var(--gold) 0%, #a48135 100%);
      color: var(--bg-dark);
      border: none;
      box-shadow: 0 15px 35px var(--gold-glow);
    }

    .btn-action.primary .btn-fr {
      color: rgba(11, 10, 9, 0.7);
    }

    .btn-action:active { 
      transform: scale(0.95) translateY(2px) !important;
    }

    .btn-action.primary:hover {
      box-shadow: 0 15px 45px rgba(207, 168, 83, 0.4);
    }

    .btn-action:not(.primary):hover {
      border-color: rgba(207, 168, 83, 0.4);
      background: rgba(26, 24, 21, 0.85);
    }

    .btn-icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(207, 168, 83, 0.15);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: var(--spring-transition);
    }

    .btn-action.primary .btn-icon-wrapper {
      background: rgba(11, 10, 9, 0.12);
      color: var(--bg-dark);
    }

    .btn-icon-wrapper svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .btn-text-group {
      text-align: right;
      flex: 1;
    }

    .btn-text-group div {
      font-size: 1.15rem;
      letter-spacing: 0.3px;
    }

    .btn-fr { 
      font-size: 0.82rem; 
      color: var(--text-muted); 
      font-family: 'Outfit'; 
      display: block; 
      margin-top: 2px;
      font-weight: 500;
    }

    /* Action Loading Overlays */
    .overlay-status {
      position: absolute;
      inset: 0;
      background: rgba(21, 19, 17, 0.95);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      font-size: 1.1rem;
    }
    
    .btn-action.primary .overlay-status {
      background: var(--gold);
      color: var(--bg-dark);
    }
    
    .btn-action.loading .overlay-status,
    .btn-action.success .overlay-status,
    .btn-action.error .overlay-status {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 24px; 
      height: 24px;
      border: 3px solid rgba(207, 168, 83, 0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .btn-action.primary .spinner { 
      border-color: rgba(11, 10, 9, 0.15); 
      border-top-color: var(--bg-dark); 
    }

    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }

    @keyframes spinDashed { 
      to { transform: rotate(360deg); } 
    }

    @keyframes logoEntrance {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeInDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* ── Menu View ── */
    #menuView {
      position: absolute;
      inset: 0;
      background: var(--bg-dark);
      z-index: 20;
      transform: translateY(100%);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    #menuView.show { 
      transform: translateY(0); 
    }

    .menu-header {
      background: var(--bg-surface);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(207, 168, 83, 0.1);
      z-index: 5;
    }
    
    .menu-title-wrapper {
      display: flex;
      flex-direction: column;
    }

    .menu-title {
      color: var(--white);
      font-weight: 800;
      font-size: 1.4rem;
      font-family: var(--font-serif);
    }
    
    .menu-title-fr {
      font-size: 0.85rem;
      color: var(--gold);
      font-family: 'Outfit';
      font-weight: 600;
      margin-top: 1px;
      letter-spacing: 0.5px;
    }

    .close-btn {
      width: 44px; 
      height: 44px;
      border-radius: 50%;
      background: rgba(207, 168, 83, 0.12);
      color: var(--gold);
      border: 1px solid rgba(207, 168, 83, 0.2);
      font-size: 1.8rem;
      display: flex; 
      align-items: center; 
      justify-content: center;
      cursor: pointer;
      transition: var(--spring-transition);
    }
    .close-btn:active {
      transform: scale(0.85);
      background: rgba(207, 168, 83, 0.25);
    }

    /* Sticky Categories Navigation */
    .categories-nav {
      position: sticky;
      top: 0;
      background: rgba(21, 19, 17, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 14px 20px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
      z-index: 4;
      border-bottom: 1px solid rgba(207, 168, 83, 0.08);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .categories-nav::-webkit-scrollbar { 
      display: none; 
    }

    .cat-tab {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(207, 168, 83, 0.15);
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--spring-transition);
    }
    
    .cat-tab.active {
      background: var(--gold);
      color: var(--bg-dark);
      border-color: var(--gold);
      box-shadow: 0 6px 20px var(--gold-glow);
    }

    /* Menu List */
    .menu-list {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 140px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .category-section {
      margin-bottom: 40px;
      scroll-margin-top: 80px;
    }
    
    .category-title {
      font-size: 1.5rem;
      color: var(--gold);
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-serif);
    }
    
    .category-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to left, rgba(207, 168, 83, 0.4), rgba(207, 168, 83, 0));
    }

    /* Dish Card Redesign */
    .dish-card {
      display: flex;
      background: var(--bg-card);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(235, 220, 185, 0.06);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      gap: 16px;
      transition: var(--spring-transition);
      opacity: 0;
      transform: translateY(24px);
      animation: fadeInUp 0.6s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .dish-card.in-cart {
      border-color: rgba(207, 168, 83, 0.5);
      background: rgba(207, 168, 83, 0.05);
      box-shadow: 0 8px 30px var(--gold-glow);
    }

    .dish-img-wrapper {
      width: 105px;
      height: 105px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .dish-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: var(--bg-surface);
      transition: transform 0.5s ease;
    }
    
    .dish-card:hover .dish-img {
      transform: scale(1.08);
    }

    .dish-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dish-name {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--white);
      line-height: 1.35;
    }
    
    .dish-name-fr {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: 'Outfit';
      font-weight: 500;
      margin-top: 3px;
    }

    .dish-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .dish-price {
      font-weight: 800;
      color: var(--gold);
      font-family: 'Outfit';
      font-size: 1.15rem;
    }

    .add-btn {
      background: rgba(207, 168, 83, 0.12);
      border: 1px solid rgba(207, 168, 83, 0.3);
      color: var(--gold);
      padding: 6px 18px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--spring-transition);
    }
    
    .add-btn:hover {
      background: var(--gold);
      color: var(--bg-dark);
      border-color: var(--gold);
    }
    
    .qty-controls {
      display: none;
      align-items: center;
      gap: 12px;
      background: rgba(207, 168, 83, 0.15);
      border: 1px solid rgba(207, 168, 83, 0.3);
      border-radius: 50px;
      padding: 4px 6px;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .dish-card.in-cart .add-btn { display: none; }
    .dish-card.in-cart .qty-controls { display: flex; }

    .qty-btn {
      width: 28px; 
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--gold);
      color: var(--bg-dark);
      font-weight: 900;
      display: flex; 
      align-items: center; 
      justify-content: center;
      cursor: pointer;
      transition: var(--spring-transition);
    }
    .qty-btn:active {
      transform: scale(0.85);
    }
    
    .qty-num { 
      font-weight: 800; 
      font-family: 'Outfit'; 
      min-width: 18px; 
      text-align: center;
      color: var(--white);
      font-size: 1.05rem;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Cart Floating Bar (iOS Pill Redesign) */
    .cart-bar {
      position: absolute;
      bottom: 24px; 
      left: 16px; 
      right: 16px;
      background: rgba(21, 19, 17, 0.92);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(207, 168, 83, 0.35);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7), 0 0 25px rgba(207, 168, 83, 0.1);
      transform: translateY(150%) scale(0.9);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
    }
    .cart-bar.active { 
      transform: translateY(0) scale(1); 
      opacity: 1;
      pointer-events: auto;
    }

    .cart-info {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    .cart-total {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--gold);
      font-family: 'Outfit';
      letter-spacing: 0.5px;
    }
    
    .cart-items-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
    }

    .order-btn {
      background: var(--gold);
      color: var(--bg-dark);
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex; 
      align-items: center; 
      gap: 10px;
      box-shadow: 0 8px 24px var(--gold-glow);
      transition: var(--spring-transition);
    }
    .order-btn:hover {
      background: var(--gold-hover);
      box-shadow: 0 8px 30px rgba(207, 168, 83, 0.4);
    }
    .order-btn:active {
      transform: scale(0.95);
    }
    .order-btn:disabled { 
      opacity: 0.5; 
      pointer-events: none;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 24px; 
      left: 50%; 
      transform: translateX(-50%) translateY(-120px);
      background: rgba(21, 19, 17, 0.95);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--gold);
      color: var(--white);
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 700;
      display: flex; 
      align-items: center; 
      gap: 12px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
      z-index: 1000;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      font-size: 1.05rem;
    }
    .toast.show { 
      transform: translateX(-50%) translateY(0); 
    }

  </style>
</head>
<body>

  <!-- Landing View -->
  <div id="landingView">
    <div class="landing-header">
      <div class="logo-container">
        <img src="./logo.jpeg" onerror="this.src='https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=200&auto=format&fit=crop'" alt="Logo" class="logo-img" />
      </div>
      <h1 class="restaurant-title" id="restName">La Citadelle</h1>
      <div class="table-badge">
        طاولة <span id="tableNum">-</span> Table
      </div>
    </div>

    <div class="actions-grid">
      <button class="btn-action primary" onclick="openMenu()">
        <div class="btn-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm8-3h-3v14h-2V6h-3V4h8v2z"/></svg>
        </div>
        <div class="btn-text-group">
          <div>عرض قائمة الطعام</div>
          <span class="btn-fr">Voir le Menu</span>
        </div>
      </button>

      <button class="btn-action" id="btn-call" onclick="handleAction('call')">
        <div class="btn-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        </div>
        <div class="btn-text-group">
          <div>استدعاء النادل</div>
          <span class="btn-fr">Appeler le Serveur</span>
        </div>
        <div class="overlay-status"><div class="spinner"></div> جاري الإرسال...</div>
      </button>

      <button class="btn-action" id="btn-bill" onclick="handleAction('bill')">
        <div class="btn-icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        </div>
        <div class="btn-text-group">
          <div>طلب الحساب</div>
          <span class="btn-fr">Demander l'Addition</span>
        </div>
        <div class="overlay-status"><div class="spinner"></div> جاري الإرسال...</div>
      </button>
    </div>
  </div>

  <!-- Menu View -->
  <div id="menuView">
    <div class="menu-header">
      <div class="menu-title-wrapper">
        <div class="menu-title">قائمة الطعام</div>
        <div class="menu-title-fr">Le Menu</div>
      </div>
      <button class="close-btn" onclick="closeMenu()">×</button>
    </div>

    <div class="categories-nav" id="catNav">
      <!-- Categories dynamically injected here -->
    </div>

    <div class="menu-list" id="menuList">
      <div style="text-align:center; padding: 60px; color: var(--text-muted);">
        <div class="spinner" style="margin: 0 auto 16px; border-color:rgba(207, 168, 83, 0.1); border-top-color:var(--gold)"></div>
        جاري تحميل القائمة...
      </div>
    </div>

    <!-- Floating Pill Cart Bar -->
    <div class="cart-bar" id="cartBar">
      <div class="cart-info">
        <div class="cart-total" id="cartTotal">0 DA</div>
        <div class="cart-items-count" id="cartCount">0 عناصر</div>
      </div>
      <button class="order-btn" id="btn-order" onclick="submitOrder()">
        <span>إرسال الطلب</span> 🚀
      </button>
    </div>
  </div>

  <!-- Notification Toast -->
  <div class="toast" id="toast">
    <span id="toast-icon">✅</span>
    <span id="toast-msg">تم الإرسال</span>
  </div>

  <script>
    // ─── Params & Config ───
    const p = new URLSearchParams(location.search);
    const TABLE    = p.get('table')    || '?';
    let NAME       = p.get('name')     || 'La Citadelle';
    const TOPIC    = p.get('topic')    || '';
    const TG_TOKEN = p.get('tg_token') || '';
    const TG_CHAT  = p.get('tg_chat')  || '';
    const WA_NUM   = p.get('wa')       || '';

    document.getElementById('restName').textContent = NAME;
    document.getElementById('tableNum').textContent = TABLE;

    const ACTIONS = {
      call: { ar: 'استدعاء النادل 🔔', fr: 'Appeler le Serveur', emoji: '🔔', ntfy: 'bell', prio: 4 },
      bill: { ar: 'طلب الحساب 💳', fr: "Demander l'Addition", emoji: '💳', ntfy: 'credit_card', prio: 5 },
      order: { ar: 'طلب جديد 🛒', fr: 'Nouvelle Commande', emoji: '🛒', ntfy: 'shopping_bags', prio: 4 }
    };

    // ─── Notifications ───
    async function notifyNtfy(actionKey, orderDetails) {
      if (!TOPIC) return { ok: false, skipped: true };
      const a = ACTIONS[actionKey];
      let body = `الطاولة ${TABLE} — ${a.ar} | ${a.fr}`;
      if (orderDetails) {
        body = `طاولة ${TABLE}: ${orderDetails.items.map(i=>i.name+' x'+i.qty).join(', ')}\n[ORDER_DATA:${JSON.stringify({table:TABLE, total:orderDetails.total, items:orderDetails.items})}]`;
      }
      try {
        const r = await fetch('https://ntfy.sh/', {
          method: 'POST',
          body: JSON.stringify({ topic: TOPIC, message: body, title: `${a.emoji} Table ${TABLE}`, priority: a.prio, tags: [a.ntfy] })
        });
        return { ok: r.ok };
      } catch(e) { return { ok: false }; }
    }

    async function notifyTg(actionKey, orderDetails) {
      if (!TG_TOKEN || !TG_CHAT) return { ok: false, skipped: true };
      const a = ACTIONS[actionKey];
      let txt = `🏪 <b>${NAME}</b>\n📍 <b>الطاولة :</b> ${TABLE}\n${a.emoji} <b>الطلب :</b> ${a.ar}\n`;
      if (orderDetails) txt += `\n📋 <b>تفاصيل :</b>\n${orderDetails.text}\n💵 <b>المجموع :</b> <b>${orderDetails.total} DA</b>`;
      try {
        const r = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ chat_id: TG_CHAT, text: txt, parse_mode: 'HTML' })
        });
        return { ok: (await r.json()).ok };
      } catch(e) { return { ok: false }; }
    }

    function notifyWa(actionKey, orderDetails) {
      if (!WA_NUM) return;
      const a = ACTIONS[actionKey];
      let txt = `[${NAME}] الطاولة ${TABLE} — ${a.ar}`;
      if (orderDetails) txt += `\n\nتفاصيل الطلب:\n${orderDetails.text}\n💵 المجموع: ${orderDetails.total} DA`;
      window.open(`https://wa.me/${WA_NUM}?text=${encodeURIComponent(txt)}`, '_blank');
    }

    function showToast(icon, msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-icon').textContent = icon;
      document.getElementById('toast-msg').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    async function handleAction(actionKey) {
      const btn = document.getElementById(`btn-${actionKey}`);
      if(btn.classList.contains('loading')) return;
      
      btn.classList.remove('error','success');
      btn.classList.add('loading');
      btn.querySelector('.overlay-status').innerHTML = `<div class="spinner"></div> جاري الإرسال...`;

      const [r1, r2] = await Promise.all([notifyNtfy(actionKey), notifyTg(actionKey)]);
      if (r1.ok || r2.ok || (r1.skipped && r2.skipped)) {
        btn.classList.replace('loading', 'success');
        btn.querySelector('.overlay-status').innerHTML = `✅ تم الإرسال`;
        showToast('✅', 'تم تنبيه الفريق بنجاح');
      } else {
        btn.classList.replace('loading', 'error');
        btn.querySelector('.overlay-status').innerHTML = `⚠️ خطأ`;
        showToast('⚠️', 'خطأ في الاتصال');
        if(WA_NUM) notifyWa(actionKey);
      }
      setTimeout(() => btn.classList.remove('success','error'), 3000);
    }

    // ─── Menu Logic ───
    let menuData = [];
    let itemsMap = {};
    let cart = {};

    function openMenu() {
      const menuView = document.getElementById('menuView');
      menuView.classList.add('show');
      
      // Motion API: Spring animation reveal for the menu panel
      if (window.Motion) {
        window.Motion.animate(menuView, { y: ["100%", "0%"] }, { type: "spring", damping: 25, stiffness: 180 });
      }
      
      if (menuData.length === 0) fetchMenu();
    }
    
    function closeMenu() {
      const menuView = document.getElementById('menuView');
      
      if (window.Motion) {
        window.Motion.animate(menuView, { y: "100%" }, { type: "spring", damping: 30, stiffness: 200 }).then(() => {
          menuView.classList.remove('show');
        });
      } else {
        menuView.classList.remove('show');
      }
    }

    async function fetchMenu() {
      try {
        const res = await fetch('./menu.json');
        const data = await res.json();
        menuData = data.menu || data.categories || [];
        renderMenu();
      } catch(e) {
        document.getElementById('menuList').innerHTML = `<div style="text-align:center;padding:60px;color:var(--red)">⚠️ خطأ في تحميل القائمة</div>`;
      }
    }

    function renderMenu() {
      const nav = document.getElementById('catNav');
      const list = document.getElementById('menuList');
      nav.innerHTML = '';
      list.innerHTML = '';

      let cardIndex = 0; // tracking index for cascade anim delays

      menuData.forEach((cat, cIdx) => {
        const catId = `cat-${cIdx}`;
        // Nav Tab
        const tab = document.createElement('div');
        tab.className = `cat-tab ${cIdx===0?'active':''}`;
        tab.textContent = cat.category_ar || cat.name;
        tab.onclick = () => {
          document.getElementById(catId).scrollIntoView({behavior:'smooth'});
        };
        nav.appendChild(tab);

        // Section Container
        const section = document.createElement('div');
        section.className = 'category-section';
        section.id = catId;
        
        let sectionHtml = `<div class="category-title">${cat.category_ar || cat.name}</div>`;
        
        cat.items.forEach((item, iIdx) => {
          const id = `item_${cIdx}_${iIdx}`;
          itemsMap[id] = item;
          const qty = cart[id] || 0;
          
          // Setup sequential animation delay style
          const delayStyle = `style="animation-delay: ${cardIndex * 0.04}s;"`;
          cardIndex++;

          sectionHtml += `
            <div class="dish-card ${qty>0?'in-cart':''}" id="card-${id}" ${delayStyle}>
              <div class="dish-info">
                <div>
                  <div class="dish-name">${item.name_ar || item.name}</div>
                  <div class="dish-name-fr">${item.name_fr || ''}</div>
                </div>
                <div class="dish-bottom">
                  <span class="dish-price">${item.price} DA</span>
                  <button class="add-btn" id="add-${id}" onclick="updateQty('${id}', 1)">إضافة +</button>
                  <div class="qty-controls" id="ctrl-${id}">
                    <button class="qty-btn" onclick="updateQty('${id}', -1)">-</button>
                    <span class="qty-num" id="qty-${id}">${qty}</span>
                    <button class="qty-btn" onclick="updateQty('${id}', 1)">+</button>
                  </div>
                </div>
              </div>
            </div>`;
        });
        
        section.innerHTML = sectionHtml;
        list.appendChild(section);
      });

      // Scroll Spy for Tabs
      list.addEventListener('scroll', () => {
        let current = '';
        const sections = document.querySelectorAll('.category-section');
        sections.forEach(sec => {
          if(list.scrollTop >= sec.offsetTop - 110) current = sec.id;
        });
        if(current) {
          document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
          const idx = current.split('-')[1];
          const activeTab = nav.children[idx];
          if(activeTab) {
            activeTab.classList.add('active');
            activeTab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
          }
        }
      });
    }

    function updateQty(id, change) {
      let q = (cart[id] || 0) + change;
      if (q < 0) q = 0;
      if (q === 0) delete cart[id];
      else cart[id] = q;

      const card = document.getElementById(`card-${id}`);
      if(card) {
        if(q > 0) {
          card.classList.add('in-cart');
          const qtyText = document.getElementById(`qty-${id}`);
          if (qtyText) qtyText.textContent = q;
          
          // Animate qty number pulse
          if(window.Motion) {
            window.Motion.animate(`#qty-${id}`, { scale: [1, 1.3, 1] }, { duration: 0.2 });
          }
        } else {
          card.classList.remove('in-cart');
        }
      }
      updateCart();
    }

    function updateCart() {
      let count = 0, total = 0;
      for(let id in cart) {
        count += cart[id];
        total += cart[id] * itemsMap[id].price;
      }
      document.getElementById('cartTotal').textContent = `${total} DA`;
      document.getElementById('cartCount').textContent = `${count} عناصر`;
      
      const bar = document.getElementById('cartBar');
      if(count > 0) {
        bar.classList.add('active');
        if (window.Motion) {
          window.Motion.animate(bar, { y: ["30px", "0px"], opacity: 1 }, { type: "spring", stiffness: 200, damping: 20 });
        }
      } else {
        bar.classList.remove('active');
      }
    }

    async function submitOrder() {
      const btn = document.getElementById('btn-order');
      if(btn.disabled) return;
      btn.disabled = true;
      const orig = btn.innerHTML;
      btn.innerHTML = `<div class="spinner"></div> جاري الإرسال...`;

      let items = [], txtLines = [], total = 0;
      for(let id in cart) {
        const item = itemsMap[id];
        const q = cart[id];
        items.push({ name: item.name_ar||item.name, qty: q, price: item.price });
        txtLines.push(`• ${q}x ${item.name_ar||item.name} (${q*item.price} DA)`);
        total += q*item.price;
      }
      const details = { items, text: txtLines.join('\n'), total };

      const [r1, r2] = await Promise.all([notifyNtfy('order', details), notifyTg('order', details)]);
      if(r1.ok || r2.ok || (r1.skipped && r2.skipped)) {
        btn.innerHTML = `✅ تم الإرسال`;
        showToast('🛒', 'تم إرسال الطلب بنجاح');
        cart = {};
        renderMenu();
        updateCart();
        setTimeout(() => { closeMenu(); btn.innerHTML = orig; btn.disabled=false; }, 2000);
      } else {
        btn.innerHTML = `⚠️ خطأ`;
        showToast('⚠️', 'فشل إرسال الطلب');
        if(WA_NUM) notifyWa('order', details);
        setTimeout(() => { btn.innerHTML = orig; btn.disabled=false; }, 2000);
      }
    }
  </script>
</body>
</html>
