<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-svg@1.1.0/lib/qrcode.min.js"></script>
</head>
<body>
  <div id="test"></div>
  <script>
    console.log("QRCode defined?", typeof QRCode !== 'undefined');
    if (typeof QRCode !== 'undefined') {
      try {
        var q = new QRCode({content: "test", width: 130, height: 130, join: true});
        document.getElementById('test').innerHTML = q.svg();
        console.log("Success:", q.svg().substring(0, 50));
      } catch (e) {
        console.log("Error:", e.message);
      }
    }
  </script>
</body>
</html>
